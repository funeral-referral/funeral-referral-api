services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-funeral_referral}
      POSTGRES_USER: ${DB_USERNAME:-funeral}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-funeral} -d ${DB_DATABASE:-funeral_referral}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

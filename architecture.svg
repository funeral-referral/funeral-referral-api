<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Funeral Home Referral Finder architecture</title>
  <desc id="d">State sources feed a crawler that writes to Postgres. A Laravel API serves a Nuxt SPA. A scheduler runs the nightly crawl and the outreach sender.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="430" fill="#ffffff"/>

  <!-- Sources -->
  <text x="20" y="24" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">PUBLIC SOURCES</text>
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="20" y="36" width="200" height="58" rx="10"/>
    <rect x="20" y="104" width="200" height="58" rx="10"/>
    <rect x="20" y="172" width="200" height="58" rx="10" stroke-dasharray="5 4"/>
  </g>
  <g fill="#0f172a" font-size="13" font-weight="600">
    <text x="36" y="60">Socrata open-data API</text>
    <text x="36" y="128">ArcGIS REST service</text>
    <text x="36" y="196" fill="#64748b">OpenStreetMap (Overpass)</text>
  </g>
  <g fill="#64748b" font-size="11.5">
    <text x="36" y="79">Colorado · Delaware · Texas</text>
    <text x="36" y="147">Arizona · Pennsylvania</text>
    <text x="36" y="215">built, off: robots.txt forbids it</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M220 65 H248"/>
    <path d="M220 133 H248"/>
    <path d="M220 201 H248" stroke-dasharray="4 3"/>
  </g>

  <!-- Crawler -->
  <rect x="250" y="36" width="230" height="194" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="266" y="60" font-size="13" font-weight="700" fill="#3730a3">Crawler (Laravel command)</text>
  <g fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2">
    <rect x="264" y="72" width="202" height="40" rx="8"/>
    <rect x="264" y="120" width="202" height="40" rx="8"/>
    <rect x="264" y="168" width="202" height="52" rx="8"/>
  </g>
  <g fill="#0f172a" font-size="12" font-weight="600">
    <text x="276" y="90">1  SourceAdapter</text>
    <text x="276" y="138">2  PoliteHttp</text>
    <text x="276" y="186">3  CrawlRunner</text>
  </g>
  <g fill="#475569" font-size="11">
    <text x="276" y="104">one small class per state</text>
    <text x="276" y="152">robots.txt, crawl-delay, rate limit</text>
    <text x="276" y="201">hash check, match, merge</text>
    <text x="276" y="214">field provenance, change events</text>
  </g>
  <path d="M480 133 H518" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Database -->
  <rect x="520" y="36" width="190" height="194" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="536" y="60" font-size="13" font-weight="700" fill="#166534">Postgres</text>
  <g fill="#0f172a" font-size="11.5">
    <text x="536" y="84">funeral_homes</text>
    <text x="536" y="104">field_values (source, date)</text>
    <text x="536" y="124">change_events</text>
    <text x="536" y="144">campaigns, messages</text>
    <text x="536" y="164">replies, suppressions</text>
    <text x="536" y="184">notes, referrals, stages</text>
  </g>
  <g fill="#64748b" font-size="11">
    <text x="536" y="212">county and score per home</text>
  </g>

  <!-- App -->
  <rect x="750" y="36" width="150" height="90" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="766" y="60" font-size="13" font-weight="700" fill="#9a3412">Laravel 13 API</text>
  <text x="766" y="80" font-size="11" fill="#475569">Sanctum bearer tokens</text>
  <text x="766" y="96" font-size="11" fill="#475569">JSON resources</text>
  <text x="766" y="112" font-size="11" fill="#475569">Docker on one VPS</text>
  <rect x="750" y="140" width="150" height="90" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.8"/>
  <text x="766" y="164" font-size="13" font-weight="700" fill="#9d174d">Nuxt 4 SPA</text>
  <text x="766" y="184" font-size="11" fill="#475569">Netlify, light and dark</text>
  <text x="766" y="200" font-size="11" fill="#475569">dashboard, map, homes</text>
  <text x="766" y="216" font-size="11" fill="#475569">outreach, pipeline</text>
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M710 81 H748"/>
    <path d="M825 126 V138"/>
  </g>
  <text x="716" y="73" font-size="10" fill="#64748b">reads</text>

  <!-- Enrichment -->
  <rect x="520" y="246" width="190" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="536" y="265" font-size="12" font-weight="600" fill="#0f172a">homes:locate → homes:score</text>
  <text x="536" y="281" font-size="11" fill="#64748b">county, ownership, score</text>
  <path d="M615 230 V244" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Scheduler -->
  <rect x="20" y="318" width="460" height="64" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/>
  <text x="36" y="342" font-size="13" font-weight="700" fill="#854d0e">Scheduler container (schedule:work)</text>
  <text x="36" y="362" font-size="11.5" fill="#475569">02:00 UTC  crawl:run, then locate and score   ·   every 15 min  outreach:send</text>
  <path d="M365 318 V232" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Outreach flow -->
  <text x="500" y="318" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">OUTREACH (EMAIL ONLY)</text>
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="500" y="330" width="92" height="64" rx="9"/>
    <rect x="606" y="330" width="92" height="64" rx="9"/>
    <rect x="712" y="330" width="92" height="64" rx="9"/>
    <rect x="818" y="330" width="92" height="64" rx="9"/>
  </g>
  <g fill="#0f172a" font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="546" y="352">Claude drafts</text>
    <text x="652" y="352">Person edits</text>
    <text x="758" y="352">Send email</text>
    <text x="864" y="352">Reply or</text>
  </g>
  <g fill="#64748b" font-size="10.5" text-anchor="middle">
    <text x="546" y="368">templates</text>
    <text x="546" y="381">if API fails</text>
    <text x="652" y="368">and approves,</text>
    <text x="652" y="381">text locks</text>
    <text x="758" y="368">opt-out link,</text>
    <text x="758" y="381">daily cap</text>
    <text x="864" y="368">opt-out stops</text>
    <text x="864" y="381">the sequence</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M592 362 H604"/>
    <path d="M698 362 H710"/>
    <path d="M804 362 H816"/>
  </g>
  <text x="20" y="412" font-size="10.5" fill="#64748b">Solid arrows are data flow. Dashed arrows are optional or scheduled. The reviewer login uses the same API as every other user.</text>
</svg>
